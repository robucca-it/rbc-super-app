<script>
/* Sama dengan PWA Robucca: kelas iPhone/standalone, dan splash hanya sekali per sesi. */
(function(){try{var d=document.documentElement,n=navigator,u=n.userAgent;
var ios=/iP(hone|od|ad)/.test(n.platform)||/iPhone|iPod/.test(u)||(u.indexOf('Mac')>-1&&n.maxTouchPoints>1);
var sa=n.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
if(ios)d.classList.add('ios');if(sa)d.classList.add('standalone');
var k='rbc:splash';if(sessionStorage.getItem(k)==='1')d.classList.add('no-splash');else sessionStorage.setItem(k,'1');
}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Poppins:wght@400;500;600;700&family=Radio+Canada+Big:wght@500;600;700&family=Jost:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Kerangka = CSS asli PWA robucca.id (apps/pwa/app/styles/pwa.css + extra.css), tidak diubah. */
/*PWA_CSS*/

/* =========================================================
   Perluasan RBC Group: tema per brand + komponen multi-brand.
   Tema hanya mengganti token yang sudah dipakai pwa.css, jadi seluruh kerangka Robucca ikut berganti warna & huruf.
   Token Kalm/Zumma sama dengan tema POS (apps/pos/src/styles/pos.css).
   ========================================================= */
:root { --rbc: #152D22; --rbc-cream: #EFE8DF; --app-w: 460px; }
html[data-brand="kalm"] {
  --bg: #E5DFD2; --bg-2: #D9D1C0; --card: #F8F5EE; --ink: #3B1A0A; --ink-2: #5C3F2E; --ink-3: #6E5444;
  --line: #D2C8B5; --greige: #BFB29C; --sand: #E4DDCF; --olive: #52230F; --olive-2: #EADBCF; --caramel: #B9773A;
  --serif: "Radio Canada Big", "Inter", system-ui, sans-serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html[data-brand="zumma"] {
  --bg: #F5EBD9; --bg-2: #EBDDC4; --card: #FFFBF4; --ink: #3D1611; --ink-2: #5E3A33; --ink-3: #6F5148;
  --line: #E6D5BB; --greige: #D3BFA0; --sand: #F0E4D0; --olive: #862F26; --olive-2: #F3DDD5; --caramel: #B8762E;
  --serif: "Jost", "Inter", system-ui, sans-serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html, body { background: var(--bg); transition: background-color .35s ease; }
.app, .menu-head, .appbar { transition: background-color .35s ease; }
.menu-head, .appbar { background: color-mix(in srgb, var(--bg) 94%, transparent); }
.splash { background: var(--rbc); }
.splash img { width: 52%; max-width: 220px; }
.tag.dark { background: var(--olive); }
.ph { background: linear-gradient(145deg, var(--sand), var(--bg-2)); color: var(--olive); }
html:not([data-brand="robucca"]) .store-card .sc-tag .tag.olive { background: var(--card); color: var(--olive); }
html:not([data-brand="robucca"]) .mode:nth-child(1) .mi { background: var(--olive-2); }
html:not([data-brand="robucca"]) .mode:nth-child(2) .mi { background: var(--sand); }
html:not([data-brand="robucca"]) .mode:nth-child(3) .mi { background: var(--bg-2); }
html[data-brand="kalm"] h1, html[data-brand="kalm"] h2 { font-weight: 700; }
html[data-brand="zumma"] .sec-h h2, html[data-brand="zumma"] .greet h1, html[data-brand="zumma"] .cat-sec > h2,
html[data-brand="zumma"] .list-head h1, html[data-brand="zumma"] .acc-head h1, html[data-brand="zumma"] .sheet-head h2,
html[data-brand="zumma"] .track-hero h1, html[data-brand="zumma"] .rsv-hero h1, html[data-brand="zumma"] .story h2,
html[data-brand="zumma"] .ticket .tk-top h2, html[data-brand="zumma"] .empty h3 { font-weight: 600; letter-spacing: .05em; }
html[data-brand="zumma"] .greet h1 { font-size: 27px; }
a { cursor: pointer; }
button { cursor: pointer; }

/* Logo brand di atas warna brand (logo resmi versi terang) */
.blogo { display: grid; place-items: center; background: var(--b); border-radius: 12px; flex: none; }
.blogo img { max-width: 78%; max-height: 74%; width: auto; height: auto; }

/* Pemilih brand di beranda: satu ketukan, seluruh tampilan ikut brand */
.brands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
.brand-btn { display: flex; flex-direction: column; align-items: stretch; gap: 7px; padding: 6px 6px 9px; border-radius: 18px; background: var(--card);
  box-shadow: var(--shadow); text-align: center; transition: transform .15s var(--ease), box-shadow .25s; min-height: 44px; }
.brand-btn:active { transform: scale(.96); }
.brand-btn .blogo { height: 52px; border-radius: 13px; }
.brand-btn b { font-size: 13px; font-weight: 600; line-height: 1.15; }
.brand-btn small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); margin-top: 1px; }
.brand-btn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink), 0 8px 18px rgba(28, 27, 25, .14); }
.brand-btn.off .blogo { filter: grayscale(1); opacity: .45; }

/* Kartu toko untuk Kalm/Zumma: foto produk di atas warna brand */
.store-card.collage { background: var(--olive); }
.store-card.collage::after { background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(15,8,5,.72)); }
.store-card .col3 { position: absolute; inset: 0; display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 0; }
.store-card .col3 img { width: 100%; height: 100%; object-fit: cover; }
.store-card .col3 img + img { border-left: 3px solid var(--olive); }

/* Menu: pemilih brand ringkas di kepala menu */
.bseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 16px 0; }
.bseg button { display: flex; align-items: center; justify-content: center; gap: 7px; height: 44px; border-radius: 14px; background: var(--bg-2);
  font-size: 13px; font-weight: 600; color: var(--ink-2); transition: background .2s, color .2s, box-shadow .2s; }
.bseg button .blogo { width: 34px; height: 26px; border-radius: 8px; }
.bseg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(41, 31, 20, .12), inset 0 0 0 1.5px var(--ink); }

/* Banner grup untuk Kalm/Zumma (tanpa foto banner resmi): warna brand + foto produk */
.slide.made { background: var(--b); color: var(--on); }
.slide.made::after { display: none; }
.slide.made .go { color: var(--b); }
.sec-h a { padding: 12px 0 12px 12px; margin: -12px 0; }
.slide.made .mk-t { padding-right: 8px; }
.slide.made .mk { position: absolute; inset: 0; display: grid; grid-template-columns: 1.1fr 1fr; }
.slide.made .mk-t { padding: 18px 0 18px 18px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; position: relative; z-index: 1; }
.slide.made .mk-t img { width: 84px; height: auto; }
.slide.made .mk-t b { font-family: var(--f); font-size: 22px; line-height: 1.05; text-transform: uppercase; font-weight: 700; letter-spacing: .02em; }
.slide.made .mk-t small { font-size: 12px; opacity: .85; }
.slide.made .mk-p { position: relative; }
.slide.made .mk-p img { position: absolute; inset: 14px 14px 56px 0; width: calc(100% - 14px); height: calc(100% - 70px); object-fit: cover; border-radius: 18px; }
.slide .bchip { position: absolute; z-index: 2; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px; border-radius: 999px;
  background: rgba(255,255,255,.94); color: #1c1b19; font-size: 11.5px; font-weight: 600; }
.slide .bchip .blogo { width: 32px; height: 20px; border-radius: 999px; }

/* Brand lain: pesan barengan */
.also { display: grid; gap: 10px; padding: 0 16px; }
.also-c { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; padding: 12px; text-align: left; width: 100%; }
.also-c .blogo { width: 76px; height: 76px; border-radius: 18px; }
.also-c b { display: block; font-size: 15px; font-weight: 600; }
.also-c small { display: block; font-size: 12px; color: var(--ink-3); line-height: 1.4; }
.also-c .thumbs { display: flex; gap: 6px; margin-top: 8px; }
.also-c .thumbs .im { width: 40px; height: 40px; border-radius: 11px; }
.also-note { display: flex; gap: 8px; align-items: center; margin: 0 16px 10px; font-size: 12.5px; color: var(--ink-2); }

/* Kartu RBC Poin (menggantikan cerita toko: sama di tiga brand) */
.rbc-band { margin: 34px 0 0; padding: 26px 16px; background: var(--rbc); color: var(--rbc-cream); }
.rbc-band img.logo { height: 30px; width: auto; margin-bottom: 14px; }
.rbc-band h2 { margin: 0 0 8px; font-family: "Poppins", var(--sans); font-size: 22px; line-height: 1.2; font-weight: 600; }
.rbc-band p { margin: 0 0 16px; color: rgba(239,232,223,.75); font-size: 13.5px; }
.rbc-band .pts-row { display: flex; gap: 8px; margin-bottom: 16px; }
.rbc-band .pts-row span { flex: 1; padding: 10px; border-radius: 14px; background: rgba(239,232,223,.08); font-size: 11.5px; line-height: 1.3; }
.rbc-band .pts-row b { display: block; font-size: 17px; font-weight: 600; color: #fff; }
.rbc-band .btn { background: var(--rbc-cream); color: var(--rbc); }

/* Keranjang: kelompok per outlet */
.og-brand { display: flex; align-items: center; gap: 10px; padding: 12px 0 4px; }
.og-brand + .ci, .og-brand ~ .ci { }
.og-brand .blogo { width: 44px; height: 30px; border-radius: 9px; }
.og-brand b { flex: 1; font-size: 14px; font-weight: 600; }
.og-brand small { font-size: 12px; color: var(--ink-3); }
.og-sep { height: 8px; margin: 10px -16px 0; background: var(--bg); }
.vch { display: flex; align-items: center; gap: 12px; width: 100%; padding: 4px 0; text-align: left; min-height: 48px; }
.vch .vi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--olive-2); color: var(--olive); flex: none; }
.vch b { display: block; font-size: 14px; font-weight: 600; }
.vch small { display: block; font-size: 12px; color: var(--ink-3); }
.ptsi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #F2D27A; color: var(--rbc); font-weight: 700; font-size: 14px; flex: none; font-family: "Poppins", sans-serif; }
.sample { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; background: var(--bg-2); color: var(--ink-3); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; vertical-align: 2px; }

/* Status: per outlet */
.subo { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.subo:last-child { border-bottom: 0; }
.subo .blogo { width: 44px; height: 44px; }
.subo b { display: block; font-size: 14px; font-weight: 600; }
.subo small { display: block; font-size: 12px; color: var(--ink-3); }
.subo .code { font-size: 15px; font-weight: 700; letter-spacing: .04em; }

/* Pesanan: logo brand di ikon kartu */
.oc .oc-h .ic.multi { width: 52px; background: none; position: relative; }
.oc .oc-h .ic .blogo { width: 40px; height: 40px; }
.oc .oc-h .ic.multi .blogo { position: absolute; width: 30px; height: 30px; border-radius: 9px; box-shadow: 0 0 0 2px var(--card); }
.oc .oc-h .ic.multi .blogo:nth-child(1) { left: 0; top: 0; }
.oc .oc-h .ic.multi .blogo:nth-child(2) { left: 14px; top: 10px; }
.oc .oc-h .ic.multi .blogo:nth-child(3) { left: 24px; top: 0; }

/* Akun: kartu member RBC */
.member { margin: 0 16px; padding: 18px; border-radius: 22px; color: var(--rbc-cream); background: radial-gradient(120% 140% at 100% 0%, #2F5D46 0%, var(--rbc) 60%); position: relative; overflow: hidden; }
.member .mk { position: absolute; right: -28px; bottom: -28px; width: 140px; opacity: .1; }
.member .tier { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #E9C46A; }
.member .big { font-family: "Poppins", sans-serif; font-size: 30px; font-weight: 600; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.member .bar { height: 6px; border-radius: 6px; background: rgba(239,232,223,.18); margin: 12px 0 6px; overflow: hidden; }
.member .bar i { display: block; height: 100%; background: #E9C46A; border-radius: 6px; }
.member small { font-size: 12px; opacity: .8; }
.member .bl { display: flex; gap: 6px; margin-top: 12px; }
.member .bl .blogo { width: 50px; height: 30px; border-radius: 8px; }

/* Cari lintas brand */
.sr-brand { display: flex; align-items: center; gap: 8px; margin: 16px 0 2px; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.sr-brand .blogo { width: 36px; height: 22px; border-radius: 7px; }

/* Lembar outlet */
.orow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; }
.orow:last-child { border-bottom: 0; }
.orow .oi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); flex: none; }
.orow b { display: block; font-size: 14.5px; font-weight: 600; }
.orow small { display: block; font-size: 12px; color: var(--ink-3); }
.orow.on .oi { background: var(--ink); color: #fff; }
.city { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 14px 0 2px; }

/* Panel prototipe di desktop (memakai .desk bawaan PWA) */
.desk { width: 320px; }
.desk-logo { width: 200px !important; }
.desk h3 { margin: 18px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.desk .flows { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.desk .flows button { text-align: left; padding: 8px 10px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); font-size: 12.5px; font-weight: 600; min-height: 44px; }
.desk .flows small { display: block; font-weight: 400; color: var(--ink-3); font-size: 11px; }
.desk ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 6px; }
.desk ul b { color: var(--ink); }
@media (min-width: 1000px) { body { background: var(--bg-2); } }

/* Menu bawah bersembunyi saat scroll ke bawah, muncul lagi saat scroll ke atas (html.nav-off dipasang di app.js).
   Keranjang & tombol bayar turun mengisi tempatnya, jadi tetap terlihat. */
.tabbar { transition: transform .28s var(--ease); }
html.nav-off .tabbar { transform: translate(-50%, 100%); }
.cartbar { transition: bottom .28s var(--ease); }
html.nav-off .cartbar { bottom: calc(var(--safe-b-t) + 10px); }
body:not(.sub) .paybar { transition: bottom .28s var(--ease), padding-bottom .28s var(--ease); }
html.nav-off body:not(.sub) .paybar { bottom: 0; padding-bottom: var(--pad-b); }
@media (prefers-reduced-motion: reduce) { .tabbar, .cartbar, body:not(.sub) .paybar { transition: none; } }
/* Animasi masuk layar tidak meninggalkan transform, supaya tombol bayar (position: fixed) menempel ke layar HP, bukan ke halaman. */
.view > .screen { animation-fill-mode: backwards; }
</style>
